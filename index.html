<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoomAI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 18px 20px;
            border-bottom: 1px solid #22232a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
        }

        .logo span {
            color: #7c5cff;
        }

        .balance {
            background: #191922;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .welcome {
            text-align: center;
            margin-top: 25vh;
        }

        .welcome-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .welcome h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #92929d;
            font-size: 15px;
            line-height: 1.5;
        }

        .message {
            max-width: 85%;
            padding: 12px 15px;
            border-radius: 16px;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .user {
            background: #7c5cff;
            margin-left: auto;
        }

        .ai {
            background: #191922;
            margin-right: auto;
        }

        .bottom {
            padding: 12px;
            border-top: 1px solid #22232a;
            background: #0b0b0f;
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #191922;
            border-radius: 18px;
            padding: 8px;
        }

        .input-box input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            padding: 10px;
            font-size: 15px;
        }

        .input-box input::placeholder {
            color: #777783;
        }

        .send {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: #7c5cff;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .model {
            text-align: center;
            color: #777783;
            font-size: 12px;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="logo">Boom<span>AI</span></div>
        <div class="balance">🪙 100 кр.</div>
    </header>

    <main class="chat" id="chat">

        <div class="welcome" id="welcome">
            <div class="welcome-icon">✨</div>

            <h1>Привет!</h1>

            <p>
                Я BoomAI — твой AI-помощник.<br>
                Напиши мне что-нибудь, и начнём.
            </p>
        </div>

    </main>

    <div class="bottom">

        <div class="input-box">
            <input
                id="messageInput"
                type="text"
                placeholder="Напишите сообщение..."
            >

            <button class="send" onclick="sendMessage()">
                ➤
            </button>
        </div>

        <div class="model">
            ⚡ BoomAI
        </div>

    </div>

    <script>
        function sendMessage() {

            const input = document.getElementById("messageInput");
            const chat = document.getElementById("chat");
            const welcome = document.getElementById("welcome");

            const text = input.value.trim();

            if (!text) return;

            if (welcome) {
                welcome.remove();
            }

            const userMessage = document.createElement("div");
            userMessage.className = "message user";
            userMessage.textContent = text;

            chat.appendChild(userMessage);

            input.value = "";

            const aiMessage = document.createElement("div");
            aiMessage.className = "message ai";
            aiMessage.textContent = "⏳ Пока я ещё не подключён к AI. Следующим шагом подключим настоящую модель.";

            chat.appendChild(aiMessage);

            chat.scrollTop = chat.scrollHeight;
        }

        document
            .getElementById("messageInput")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    sendMessage();
                }

            });
    </script>

</body>
</html>
